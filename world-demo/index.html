<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>龙虾安全世界 v3 · RPG 完整世界</title>
  <style>
    :root {
      --bg: #070d17;
      --panel: rgba(8, 14, 26, 0.94);
      --panel-border: #1f3a5a;
      --text: #e9f6ff;
      --muted: #97afc4;
      --danger: #ff5f5f;
      --safe: #00d47a;
      --xp: #00c7ff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at 16% 12%, rgba(72, 187, 255, 0.14), transparent 36%),
        radial-gradient(circle at 86% 88%, rgba(242, 155, 44, 0.12), transparent 32%),
        var(--bg);
      color: var(--text);
      font-family: "Courier New", monospace;
      overflow: hidden;
    }

    .app-shell {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 1fr 300px;
    }

    #game-wrap {
      position: relative;
      min-width: 0;
      min-height: 0;
      border-right: 1px solid rgba(31, 58, 90, 0.85);
    }

    #game-container {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    #game-container canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .world-tag {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 6;
      padding: 6px 10px;
      border: 1px solid rgba(0, 199, 255, 0.25);
      border-radius: 8px;
      background: rgba(6, 18, 34, 0.72);
      font-size: 12px;
      color: #b9e8ff;
      pointer-events: none;
    }

    #ui-overlay {
      background: var(--panel);
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 14px;
      min-height: 0;
      border-left: 1px solid rgba(255, 255, 255, 0.02);
    }

    .status-card,
    .events-card {
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      background: rgba(13, 25, 43, 0.85);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.03), 0 8px 20px rgba(0, 0, 0, 0.28);
    }

    .status-card {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .mode-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .mode-pill {
      border: 1px solid rgba(0, 199, 255, 0.4);
      border-radius: 999px;
      padding: 2px 8px;
      color: #6fe1ff;
      font-size: 10px;
      background: rgba(0, 199, 255, 0.1);
    }

    .mode-pill.live {
      border-color: rgba(0, 212, 122, 0.5);
      color: #65ffba;
      background: rgba(0, 212, 122, 0.1);
    }

    .floor-indicator {
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 8px;
      padding: 6px 8px;
      color: #cfe8ff;
      font-size: 12px;
      background: rgba(255, 255, 255, 0.02);
    }

    .location-row {
      font-size: 15px;
      color: #f4fbff;
      line-height: 1.3;
      word-break: break-word;
    }

    .mood-row,
    .threat-row,
    .meta-row {
      font-size: 12px;
      line-height: 1.4;
      word-break: break-word;
    }

    .mood-row {
      color: #dceeff;
    }

    .threat-row {
      color: #ff9d9d;
    }

    .threat-row.safe {
      color: var(--safe);
    }

    .meta-row {
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }

    .bars {
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 8px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      column-gap: 6px;
      row-gap: 8px;
      align-items: center;
      background: rgba(255, 255, 255, 0.02);
    }

    .bar-label,
    .bar-value {
      font-size: 11px;
      color: #bad1e7;
    }

    .bar-track {
      height: 10px;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.06);
    }

    .bar-fill {
      width: 0;
      height: 100%;
      transition: width 0.35s ease;
    }

    .bar-fill.hp {
      background: linear-gradient(90deg, #00d47a, #56ffc1);
    }

    .bar-fill.xp {
      background: linear-gradient(90deg, #00a7ff, #00e5ff);
    }

    .events-card {
      flex: 1;
      min-height: 210px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .events-head {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      color: #d7ebff;
      font-size: 12px;
    }

    #eventsList {
      margin: 0;
      padding: 8px 10px;
      list-style: none;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .event-item {
      display: grid;
      grid-template-columns: 16px 1fr;
      gap: 8px;
      font-size: 11px;
      color: #d0e3f3;
      line-height: 1.35;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.08);
      padding-bottom: 5px;
    }

    .event-item:last-child {
      border-bottom: 0;
      padding-bottom: 1px;
    }

    .event-mark {
      text-align: center;
      color: #68cbff;
      font-weight: bold;
    }

    .event-item.safe .event-mark {
      color: var(--safe);
    }

    .event-item.danger .event-mark {
      color: var(--danger);
    }

    .event-item.move .event-mark {
      color: #8bb9ff;
    }

    @media (max-width: 1080px) {
      body {
        overflow: auto;
      }

      .app-shell {
        grid-template-columns: 1fr;
        grid-template-rows: 58vh auto;
      }

      #game-wrap {
        border-right: 0;
        border-bottom: 1px solid rgba(31, 58, 90, 0.85);
      }

      #ui-overlay {
        min-height: 320px;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <section id="game-wrap">
      <div class="world-tag" id="worldTag">🦞 龙虾安全世界 v3</div>
      <div id="game-container"></div>
    </section>

    <aside id="ui-overlay">
      <div class="status-card">
        <div class="mode-row">
          <span id="nameLevel">小白 · Lv.3</span>
          <span class="mode-pill" id="modeBadge">DEMO</span>
        </div>

        <div class="floor-indicator" id="floorText">🌍 城市地图</div>
        <div class="location-row" id="locationText">🏠 小白的家</div>
        <div class="mood-row" id="moodText">🙂 好奇</div>
        <div class="threat-row" id="threatText">⚡ 路由器出现陌生设备</div>

        <div class="bars">
          <div class="bar-label">HP</div>
          <div class="bar-track"><div class="bar-fill hp" id="hpBar"></div></div>
          <div class="bar-value" id="hpValue">100%</div>

          <div class="bar-label">XP</div>
          <div class="bar-track"><div class="bar-fill xp" id="xpBar"></div></div>
          <div class="bar-value" id="xpValue">50%</div>
        </div>

        <div class="meta-row">
          <span>已解决威胁: <b id="resolvedCount">35</b></span>
          <span id="updatedText">--:--:--</span>
        </div>
      </div>

      <div class="events-card">
        <div class="events-head">📋 实时事件流</div>
        <ul id="eventsList"></ul>
      </div>
    </aside>
  </div>

  <script src="./vendor/phaser.min.js"></script>
  <script>
    (() => {
      const TILE = 16;
      const SCALE = 2;
      const OW_W = 40;
      const OW_H = 28;
      const IN_W = 20;
      const IN_H = 14;

      const INDOOR_ROOMS = new Set(["home", "cafe", "office", "temple", "bank", "shelter"]);

      const BUILDINGS = {
        home: { id: "home", icon: "🏠", name: "小白的家", tx: 4, ty: 4, tw: 4, th: 4, roomName: "小白的家" },
        cafe: { id: "cafe", icon: "☕", name: "咖啡厅", tx: 4, ty: 15, tw: 4, th: 4, roomName: "咖啡厅" },
        office: { id: "office", icon: "🏢", name: "职场", tx: 14, ty: 3, tw: 5, th: 5, roomName: "职场" },
        market: { id: "market", icon: "🛒", name: "网购广场", tx: 13, ty: 13, tw: 5, th: 4, roomName: "网购广场" },
        social: { id: "social", icon: "📱", name: "社交广场", tx: 23, ty: 8, tw: 4, th: 4, roomName: "社交广场" },
        bank: { id: "bank", icon: "🏦", name: "网络银行", tx: 23, ty: 19, tw: 5, th: 4, roomName: "网络银行" },
        temple: { id: "temple", icon: "🏛", name: "神庙区", tx: 15, ty: 4, tw: 4, th: 5, roomName: "神庙区" },
        shelter: { id: "shelter", icon: "🛡", name: "安全屋", tx: 32, ty: 12, tw: 4, th: 4, roomName: "安全屋" }
      };

      const LOCATION_MAP = {
        数字市集: "market",
        网购广场: "market",
        社交网络: "social",
        社交广场: "social",
        漏洞沼泽: "cafe",
        咖啡厅: "cafe",
        数据中心: "office",
        职场: "office",
        神庙: "temple",
        神庙区: "temple",
        密码丛林: "temple",
        暗网交易所: "bank",
        网络银行: "bank",
        防火墙要塞: "shelter",
        安全岛: "shelter",
        安全屋: "shelter",
        小白的家: "home",
        家: "home"
      };

      const MOOD_ICON = {
        好奇: "🙂",
        放松: "😌",
        警惕: "😐",
        紧张: "😰",
        危险: "😨",
        恐慌: "😱",
        自豪: "😎"
      };

      const MOOD_HP = {
        好奇: 100,
        放松: 100,
        警惕: 80,
        紧张: 60,
        危险: 30,
        恐慌: 15,
        自豪: 100
      };

      const DEMO_SCRIPT = [
        { t: 0, location: "小白的家", mood: "好奇", threat: "路由器出现陌生设备", event: "▶ 06:00 家庭网络出现不明设备" },
        { t: 10, location: "咖啡厅", mood: "警惕", threat: "检测到 Evil Twin WiFi", event: "→ 06:10 进入咖啡厅" },
        { t: 20, location: "咖啡厅", mood: "紧张", threat: "中间人攻击流量", event: "▶ 06:20 发现中间人攻击" },
        { t: 30, location: "安全屋", mood: "放松", threat: null, event: "✓ 06:30 威胁已阻断" },
        { t: 40, location: "职场", mood: "警惕", threat: "收到伪造CEO邮件", event: "▶ 06:40 收到可疑邮件" },
        { t: 50, location: "神庙区", mood: "紧张", threat: "进入神庙挑战", event: "→ 06:50 进入神庙备战" },
        { t: 60, location: "网络银行", mood: "危险", threat: "检测到ATM劫持装置", event: "▶ 07:00 ATM异常告警" },
        { t: 70, location: "小白的家", mood: "自豪", threat: null, event: "✓ 07:10 本轮挑战完成" }
      ];

      const DEFAULT_STATE = {
        xiaobai_name: "小白",
        level: 3,
        location: "小白的家",
        mood: "好奇",
        threat: "路由器出现陌生设备",
        resolved_threats: 35,
        last_event: "▶ 06:00 家庭网络出现不明设备",
        last_updated: new Date().toISOString()
      };

      const bus = new Phaser.Events.EventEmitter();

      const app = {
        mode: "DEMO",
        layer: "overworld",
        state: { ...DEFAULT_STATE },
        currentSceneId: "home",
        pendingSceneId: null,
        navigationBusy: false,
        events: [],
        demoTimer: null,
        demoStart: Date.now(),
        demoIndex: -1,
        demoResolved: DEFAULT_STATE.resolved_threats,
        demoLevel: DEFAULT_STATE.level,
        liveSignature: "",
        liveMisses: 0
      };

      let gameRef = null;
      let overworldRef = null;
      let indoorRef = null;

      const dom = {
        worldTag: document.getElementById("worldTag"),
        modeBadge: document.getElementById("modeBadge"),
        nameLevel: document.getElementById("nameLevel"),
        floorText: document.getElementById("floorText"),
        locationText: document.getElementById("locationText"),
        moodText: document.getElementById("moodText"),
        threatText: document.getElementById("threatText"),
        hpBar: document.getElementById("hpBar"),
        hpValue: document.getElementById("hpValue"),
        xpBar: document.getElementById("xpBar"),
        xpValue: document.getElementById("xpValue"),
        resolvedCount: document.getElementById("resolvedCount"),
        updatedText: document.getElementById("updatedText"),
        eventsList: document.getElementById("eventsList")
      };

      function clamp(v, min, max) {
        return Math.max(min, Math.min(max, v));
      }

      function resolveSceneId(location) {
        return LOCATION_MAP[location] || "home";
      }

      function formatTime(value) {
        try {
          const d = new Date(value);
          if (Number.isNaN(d.getTime())) return "--:--:--";
          return d.toLocaleTimeString("zh-CN", { hour12: false });
        } catch {
          return "--:--:--";
        }
      }

      function moodToSpeed(mood) {
        if (mood === "危险" || mood === "恐慌") return 1.9;
        if (mood === "警惕" || mood === "紧张") return 1.35;
        return 1;
      }

      function resolvedToXp(resolved) {
        return (((Number(resolved) || 0) * 10) % 100 + 100) % 100;
      }

      function classifyEvent(text) {
        if (!text) return "info";
        if (text.includes("✓")) return "safe";
        if (text.includes("→")) return "move";
        if (text.includes("⚠") || text.includes("危险") || text.includes("攻击") || text.includes("可疑")) return "danger";
        return "info";
      }

      function addEvent(text) {
        if (!text) return;
        const now = new Date();
        const hh = String(now.getHours()).padStart(2, "0");
        const mm = String(now.getMinutes()).padStart(2, "0");
        app.events.unshift({
          id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
          time: `${hh}:${mm}`,
          type: classifyEvent(text),
          text
        });
        app.events = app.events.slice(0, 18);
      }

      function renderEvents() {
        dom.eventsList.innerHTML = "";
        for (const item of app.events) {
          const li = document.createElement("li");
          li.className = `event-item ${item.type}`;

          const mark = document.createElement("span");
          mark.className = "event-mark";
          mark.textContent = item.type === "safe" ? "✓" : item.type === "move" ? "→" : item.type === "danger" ? "⚠" : "▶";

          const text = document.createElement("span");
          text.textContent = `${item.time} ${item.text.replace(/^[✓→▶⚠]\s*/, "")}`;

          li.appendChild(mark);
          li.appendChild(text);
          dom.eventsList.appendChild(li);
        }
      }

      function updateUI() {
        const state = app.state;
        const sceneId = resolveSceneId(state.location);
        const building = BUILDINGS[sceneId] || BUILDINGS.home;
        const mood = state.mood || "好奇";
        const hp = clamp(MOOD_HP[mood] ?? 70, 0, 100);
        const xp = clamp(resolvedToXp(state.resolved_threats), 0, 100);

        dom.nameLevel.textContent = `${state.xiaobai_name || "小白"} · Lv.${state.level || 1}`;
        dom.modeBadge.textContent = app.mode;
        dom.modeBadge.classList.toggle("live", app.mode === "LIVE");

        const floorText = app.layer === "indoor" ? `${building.icon} ${building.roomName} · 室内` : "🌍 城市地图";
        dom.floorText.textContent = floorText;

        dom.locationText.textContent = `${building.icon} ${state.location || building.name}`;
        dom.moodText.textContent = `${MOOD_ICON[mood] || "🫧"} ${mood}`;

        if (state.threat) {
          dom.threatText.classList.remove("safe");
          dom.threatText.textContent = `⚡ ${state.threat}`;
        } else {
          dom.threatText.classList.add("safe");
          dom.threatText.textContent = "⚡ 当前无威胁";
        }

        dom.hpBar.style.width = `${hp}%`;
        dom.hpValue.textContent = `${hp}%`;

        dom.xpBar.style.width = `${xp}%`;
        dom.xpValue.textContent = `${xp}%`;

        dom.resolvedCount.textContent = String(state.resolved_threats || 0);
        dom.updatedText.textContent = formatTime(state.last_updated);

        dom.worldTag.textContent = app.layer === "indoor" ? "🦞 龙虾安全世界 v3 · 室内" : "🦞 龙虾安全世界 v3 · 城市";
        renderEvents();
      }

      function normalizeState(input) {
        const s = { ...app.state };
        if (input.xiaobai_name) s.xiaobai_name = String(input.xiaobai_name);
        if (Number.isFinite(Number(input.level))) s.level = Number(input.level);
        if (input.location) s.location = String(input.location);
        if (input.mood) s.mood = String(input.mood);
        if (Object.prototype.hasOwnProperty.call(input, "threat")) {
          s.threat = input.threat ? String(input.threat) : null;
        }
        if (Number.isFinite(Number(input.resolved_threats))) s.resolved_threats = Number(input.resolved_threats);
        if (input.last_event) s.last_event = String(input.last_event);
        s.last_updated = input.last_updated || new Date().toISOString();
        return s;
      }

      function setMode(mode) {
        app.mode = mode;
        updateUI();
      }

      function buildGrid(width, height, fill) {
        return Array.from({ length: height }, () => Array(width).fill(fill));
      }

      function paintRect(grid, x, y, w, h, val) {
        for (let yy = y; yy < y + h; yy += 1) {
          for (let xx = x; xx < x + w; xx += 1) {
            if (yy >= 0 && yy < grid.length && xx >= 0 && xx < grid[0].length) {
              grid[yy][xx] = val;
            }
          }
        }
      }

      function paintRoad(grid, x1, y1, x2, y2, width, val) {
        const half = Math.floor(width / 2);
        if (x1 === x2) {
          const [from, to] = y1 <= y2 ? [y1, y2] : [y2, y1];
          for (let y = from; y <= to; y += 1) {
            paintRect(grid, x1 - half, y - half, width, width, val);
          }
          return;
        }
        if (y1 === y2) {
          const [from, to] = x1 <= x2 ? [x1, x2] : [x2, x1];
          for (let x = from; x <= to; x += 1) {
            paintRect(grid, x - half, y1 - half, width, width, val);
          }
        }
      }

      function tileToWorld(tx, ty) {
        return { x: tx * TILE * SCALE + TILE, y: ty * TILE * SCALE + TILE };
      }

      function getEntranceTxTy(sceneId) {
        const b = BUILDINGS[sceneId] || BUILDINGS.home;
        return {
          tx: Math.floor(b.tx + b.tw / 2),
          ty: b.ty + b.th
        };
      }

      class BootScene extends Phaser.Scene {
        constructor() {
          super("BootScene");
        }

        preload() {
          const w = this.scale.width;
          const h = this.scale.height;
          const barBg = this.add.rectangle(w / 2, h / 2, 320, 20, 0x1f2d42).setStrokeStyle(2, 0x5ea5ff, 0.8);
          const bar = this.add.rectangle(w / 2 - 156, h / 2, 8, 12, 0x00d4ff).setOrigin(0, 0.5);
          const label = this.add.text(w / 2, h / 2 - 30, "加载像素世界资源...", {
            fontFamily: "monospace",
            fontSize: "16px",
            color: "#d7edff"
          }).setOrigin(0.5);

          this.load.on("progress", (p) => {
            bar.width = 312 * p;
          });

          this.load.on("complete", () => {
            barBg.destroy();
            bar.destroy();
            label.destroy();
          });

          this.load.image("tileset-outdoor", "assets/kenney/tiny-town/tilemap_packed.png");
          this.load.image("tileset-indoor", "assets/kenney/tiny-dungeon/tilemap_packed.png");
          this.load.spritesheet("tileset-outdoor-sprites", "assets/kenney/tiny-town/tilemap_packed.png", {
            frameWidth: 16,
            frameHeight: 16
          });
          this.load.spritesheet("tileset-indoor-sprites", "assets/kenney/tiny-dungeon/tilemap_packed.png", {
            frameWidth: 16,
            frameHeight: 16
          });
          this.load.image("town-sample", "assets/kenney/tiny-town/sample_clean.png");
          this.load.image("dungeon-sample", "assets/kenney/tiny-dungeon/sample_clean.png");
          this.load.spritesheet("xiaobai", "assets/kenney/tiny-dungeon/tilemap_packed.png", {
            frameWidth: 16,
            frameHeight: 16
          });
        }

        create() {
          const makeAnim = (key, frames, frameRate = 8) => {
            if (this.anims.exists(key)) return;
            this.anims.create({
              key,
              frames: frames.map((f) => ({ key: "xiaobai", frame: f })),
              frameRate,
              repeat: -1
            });
          };

          makeAnim("walk-down", [110, 110, 110], 8);
          makeAnim("walk-side", [110, 110, 110], 8);
          makeAnim("walk-up", [110, 110, 110], 8);

          if (!this.anims.exists("idle-down")) {
            this.anims.create({ key: "idle-down", frames: [{ key: "xiaobai", frame: 110 }], frameRate: 1, repeat: -1 });
          }
          if (!this.anims.exists("idle-up")) {
            this.anims.create({ key: "idle-up", frames: [{ key: "xiaobai", frame: 110 }], frameRate: 1, repeat: -1 });
          }

          this.scene.start("OverworldScene");
          this.scene.launch("UIScene");
        }
      }

      class OverworldScene extends Phaser.Scene {
        constructor() {
          super("OverworldScene");
          this.player = null;
          this.playerShell = null;
          this.playerClaws = null;
          this.moveTween = null;
          this.stressTween = null;
          this.templeTorches = [];
          this.currentAnim = "idle-down";
        }

        create() {
          overworldRef = this;
          this.buildMap();
          this.buildBuildingsLabel();
          this.buildPlayer();
          this.buildTempleFire();

          this.cameras.main.setBackgroundColor("#050d1a");
          this.cameras.main.setBounds(0, 0, OW_W * TILE * SCALE, OW_H * TILE * SCALE);
          this.cameras.main.startFollow(this.playerShell, true, 0.09, 0.09);
          this.cameras.main.setRoundPixels(true);

          this.applyMood(app.state.mood);
        }

        buildMap() {
          this.add.image(OW_W * TILE, OW_H * TILE, "town-sample")
            .setDisplaySize(OW_W * TILE * SCALE + 180, OW_H * TILE * SCALE + 120)
            .setAlpha(0.2)
            .setDepth(0);

          const ground = buildGrid(OW_W, OW_H, 0);
          const road = buildGrid(OW_W, OW_H, -1);
          const decor = buildGrid(OW_W, OW_H, -1);
          const structures = buildGrid(OW_W, OW_H, -1);

          const roadMask = Array.from({ length: OW_H }, () => Array(OW_W).fill(false));
          const pathTiles = [12, 13, 14, 24, 25, 26, 36, 37, 38, 39, 40, 41, 42];
          const treeTiles = [3, 4, 5, 9, 10, 11, 15, 16, 17, 21, 22, 23, 27, 28, 29, 33, 34, 35];

          for (let y = 0; y < OW_H; y += 1) {
            for (let x = 0; x < OW_W; x += 1) {
              const noise = (x * 17 + y * 31 + x * y * 3) % 11;
              ground[y][x] = noise < 2 ? 1 : 0;
              if (noise === 10) ground[y][x] = 2;
            }
          }

          const markRoad = (tx, ty) => {
            if (tx < 0 || ty < 0 || tx >= OW_W || ty >= OW_H) return;
            roadMask[ty][tx] = true;
          };

          const paintRoadMask = (x1, y1, x2, y2, width = 1) => {
            const half = Math.floor(width / 2);
            if (x1 === x2) {
              const [from, to] = y1 <= y2 ? [y1, y2] : [y2, y1];
              for (let y = from; y <= to; y += 1) {
                for (let w = -half; w <= half; w += 1) markRoad(x1 + w, y);
              }
              return;
            }
            if (y1 === y2) {
              const [from, to] = x1 <= x2 ? [x1, x2] : [x2, x1];
              for (let x = from; x <= to; x += 1) {
                for (let w = -half; w <= half; w += 1) markRoad(x, y1 + w);
              }
            }
          };

          const links = [
            ["home", "cafe"],
            ["home", "office"],
            ["office", "temple"],
            ["temple", "market"],
            ["market", "cafe"],
            ["market", "social"],
            ["social", "bank"],
            ["market", "shelter"],
            ["shelter", "bank"]
          ];

          for (const [fromId, toId] of links) {
            const from = getEntranceTxTy(fromId);
            const to = getEntranceTxTy(toId);
            paintRoadMask(from.tx, from.ty, from.tx, to.ty, 1);
            paintRoadMask(from.tx, to.ty, to.tx, to.ty, 1);
          }

          for (let y = 0; y < OW_H; y += 1) {
            for (let x = 0; x < OW_W; x += 1) {
              if (!roadMask[y][x]) continue;
              const n = y > 0 && roadMask[y - 1][x];
              const s = y < OW_H - 1 && roadMask[y + 1][x];
              const w = x > 0 && roadMask[y][x - 1];
              const e = x < OW_W - 1 && roadMask[y][x + 1];

              if ((n && s && e && w) || ((n || s) && (e || w))) {
                road[y][x] = 37;
              } else if (n && s) {
                road[y][x] = [13, 25, 37][(x + y) % 3];
              } else if (e && w) {
                road[y][x] = [24, 25, 26][(x + y) % 3];
              } else if ((n && e) || (s && w)) {
                road[y][x] = [14, 38, 42][(x + y) % 3];
              } else if ((n && w) || (s && e)) {
                road[y][x] = [12, 36, 40][(x + y) % 3];
              } else {
                road[y][x] = pathTiles[(x * 5 + y * 7) % pathTiles.length];
              }
            }
          }

          const styleMap = {
            home: { roof: 49, wall: 37, door: 74 },
            cafe: { roof: 53, wall: 41, door: 74 },
            office: { roof: 50, wall: 38, door: 74 },
            market: { roof: 54, wall: 42, door: 74 },
            social: { roof: 55, wall: 43, door: 74 },
            bank: { roof: 52, wall: 40, door: 74 },
            temple: { roof: 111, wall: 124, door: 126 },
            shelter: { roof: 51, wall: 39, door: 74 }
          };

          const put = (layer, tx, ty, tile) => {
            if (tx < 0 || ty < 0 || tx >= OW_W || ty >= OW_H) return;
            layer[ty][tx] = tile;
          };

          const paintFenceRect = (tx, ty, tw, th) => {
            for (let x = tx; x < tx + tw; x += 1) {
              put(decor, x, ty, x === tx ? 44 : x === tx + tw - 1 ? 46 : 45);
              put(decor, x, ty + th - 1, x === tx ? 68 : x === tx + tw - 1 ? 70 : 69);
            }
            for (let y = ty + 1; y < ty + th - 1; y += 1) {
              put(decor, tx, y, 56);
              put(decor, tx + tw - 1, y, 58);
            }
          };

          const paintHouse = (tx, ty, w, style, withDoor = true) => {
            for (let x = 0; x < w; x += 1) {
              put(structures, tx + x, ty, style.roof);
              put(structures, tx + x, ty + 1, style.wall);
              put(structures, tx + x, ty + 2, style.wall);
            }
            if (withDoor) {
              put(structures, tx + Math.floor(w / 2), ty + 2, style.door);
            }
          };

          Object.values(BUILDINGS).forEach((b, i) => {
            const lotX = b.tx;
            const lotY = b.ty;
            const lotW = b.tw;
            const lotH = b.th;
            const style = styleMap[b.id] || styleMap.home;

            for (let y = lotY; y < lotY + lotH; y += 1) {
              for (let x = lotX; x < lotX + lotW; x += 1) {
                ground[y][x] = [24, 25, 36, 37, 38, 39, 40][(x + y + i) % 7];
              }
            }

            paintFenceRect(lotX - 1, lotY - 1, lotW + 2, lotH + 2);

            if (b.id === "temple") {
              const cx = lotX + Math.floor(lotW / 2) - 1;
              put(structures, cx, lotY + 1, 111);
              put(structures, cx + 1, lotY + 1, 112);
              put(structures, cx + 2, lotY + 1, 113);
              put(structures, cx, lotY + 2, 123);
              put(structures, cx + 1, lotY + 2, 124);
              put(structures, cx + 2, lotY + 2, 125);
              put(structures, cx, lotY + 3, 123);
              put(structures, cx + 1, lotY + 3, 126);
              put(structures, cx + 2, lotY + 3, 125);
              put(decor, cx - 1, lotY + 3, 93);
              put(decor, cx + 3, lotY + 3, 93);
            } else if (b.id === "bank") {
              const bx = lotX + 1;
              const by = lotY + 1;
              paintHouse(bx, by, Math.max(3, lotW - 2), style, true);
              put(decor, bx - 1, by + 1, 104);
              put(decor, bx + lotW - 2, by + 1, 104);
              put(decor, bx + Math.floor((lotW - 2) / 2), by - 1, 94);
            } else if (b.id === "shelter") {
              const sx = lotX + Math.floor((lotW - 3) / 2);
              paintHouse(sx, lotY + 1, 3, style, true);
              put(decor, sx + 1, lotY + 4, 93);
              put(decor, sx - 1, lotY + 3, 105);
              put(decor, sx + 3, lotY + 3, 106);
            } else {
              const bw = b.id === "office" || b.id === "market" ? 4 : 3;
              const bx = b.tx + Math.floor((b.tw - bw) / 2);
              paintHouse(bx, b.ty + 1, bw, style, true);
              if (b.id === "cafe") put(decor, bx + bw - 1, b.ty + 4, 95);
              if (b.id === "home") put(decor, bx - 1, b.ty + 3, 105);
              if (b.id === "office") put(decor, bx + bw, b.ty + 3, 103);
            }

            const treeLeft = lotX - 2;
            const treeRight = lotX + lotW + 1;
            put(decor, treeLeft, lotY + 1, treeTiles[(i * 3 + 1) % treeTiles.length]);
            put(decor, treeRight, lotY + 1, treeTiles[(i * 3 + 2) % treeTiles.length]);
            put(decor, lotX + Math.floor(lotW / 2), lotY - 2, treeTiles[(i * 3 + 3) % treeTiles.length]);
          });

          for (let x = 1; x < OW_W - 1; x += 2) {
            put(decor, x, 1, treeTiles[(x + 1) % treeTiles.length]);
            put(decor, x, OW_H - 2, treeTiles[(x + 7) % treeTiles.length]);
          }
          for (let y = 2; y < OW_H - 2; y += 3) {
            put(decor, 1, y, treeTiles[(y + 3) % treeTiles.length]);
            put(decor, OW_W - 2, y, treeTiles[(y + 6) % treeTiles.length]);
          }

          [[10, 10], [20, 10], [30, 10], [20, 18], [31, 18]].forEach(([x, y], i) => {
            put(decor, x, y, [57, 58, 59][i % 3]);
          });

          const map = this.make.tilemap({
            width: OW_W,
            height: OW_H,
            tileWidth: TILE,
            tileHeight: TILE
          });
          const tileset = map.addTilesetImage("tileset-outdoor", null, TILE, TILE, 0, 0);

          this.groundLayer = map.createBlankLayer("ground", tileset, 0, 0);
          this.roadLayer = map.createBlankLayer("road", tileset, 0, 0);
          this.buildingLayer = map.createBlankLayer("building", tileset, 0, 0);
          this.decorLayer = map.createBlankLayer("decor", tileset, 0, 0);

          const applyData = (layer, data) => {
            for (let y = 0; y < data.length; y += 1) {
              for (let x = 0; x < data[y].length; x += 1) {
                const idx = data[y][x];
                if (idx >= 0) layer.putTileAt(idx, x, y);
              }
            }
          };

          applyData(this.groundLayer, ground);
          applyData(this.roadLayer, road);
          applyData(this.buildingLayer, structures);
          applyData(this.decorLayer, decor);

          [this.groundLayer, this.roadLayer, this.buildingLayer, this.decorLayer].forEach((layer) => {
            layer.setScale(SCALE);
            layer.setDepth(1);
          });

          this.roadLayer.setDepth(2);
          this.buildingLayer.setDepth(4);
          this.decorLayer.setDepth(5);

          const shadow = this.add.graphics().setDepth(3);
          shadow.fillStyle(0x000000, 0.2);
          for (const b of Object.values(BUILDINGS)) {
            const cx = (b.tx + b.tw / 2) * TILE * SCALE;
            const cy = (b.ty + b.th + 0.3) * TILE * SCALE;
            shadow.fillEllipse(cx, cy, b.tw * TILE * 1.2, 16);
          }
        }

        buildBuildingsLabel() {
          for (const b of Object.values(BUILDINGS)) {
            const p = tileToWorld(b.tx + b.tw / 2, b.ty - 0.5);
            this.add.text(p.x, p.y, `${b.icon} ${b.name}`, {
              fontFamily: "monospace",
              fontSize: "12px",
              color: "#fff9e4",
              stroke: "#3b2924",
              strokeThickness: 4
            }).setOrigin(0.5).setDepth(15);
          }
        }

        buildPlayer() {
          const start = getEntranceTxTy("home");
          const world = tileToWorld(start.tx, start.ty);

          this.player = this.add.sprite(0, 0, "xiaobai", 110).setScale(2).setDepth(30);
          this.player.setOrigin(0.5, 0.75);
          this.player.play("idle-down");

          this.playerClaws = this.add.graphics();
          this.playerClaws.fillStyle(0xff5f40, 0.95);
          this.playerClaws.fillRect(-12, -10, 5, 3);
          this.playerClaws.fillRect(7, -10, 5, 3);
          this.playerClaws.fillStyle(0xffc3b8, 0.7);
          this.playerClaws.fillRect(-4, -13, 3, 2);
          this.playerClaws.fillRect(1, -13, 3, 2);

          this.playerShell = this.add.container(world.x, world.y, [this.player, this.playerClaws]);
          this.playerShell.setDepth(30);
        }

        buildTempleFire() {
          const temple = BUILDINGS.temple;
          const points = [
            tileToWorld(temple.tx - 1, temple.ty + 1),
            tileToWorld(temple.tx + temple.tw + 1, temple.ty + 1),
            tileToWorld(temple.tx - 1, temple.ty + temple.th - 1),
            tileToWorld(temple.tx + temple.tw + 1, temple.ty + temple.th - 1)
          ];

          for (const p of points) {
            const torch = this.add.sprite(p.x, p.y, "tileset-outdoor-sprites", 71).setScale(2).setDepth(15);
            this.templeTorches.push(torch);
            this.tweens.add({
              targets: torch,
              alpha: { from: 0.5, to: 1 },
              duration: 180,
              yoyo: true,
              repeat: -1
            });
          }
        }

        applyMood(mood) {
          const speed = moodToSpeed(mood);
          this.player.anims.timeScale = speed;

          if (this.stressTween) {
            this.stressTween.stop();
            this.stressTween = null;
            this.playerShell.x = Math.round(this.playerShell.x);
          }

          if (mood === "危险" || mood === "恐慌") {
            this.stressTween = this.tweens.add({
              targets: this.playerShell,
              x: this.playerShell.x + 2,
              yoyo: true,
              duration: 50,
              repeat: -1,
              onUpdate: () => {
                this.playerShell.x = Math.round(this.playerShell.x);
              }
            });
          }
        }

        playWalkAnim(dx, dy) {
          if (Math.abs(dx) > Math.abs(dy)) {
            this.player.play("walk-side", true);
            this.player.setFlipX(dx < 0);
            this.currentAnim = "walk-side";
          } else if (dy < 0) {
            this.player.play("walk-up", true);
            this.player.setFlipX(false);
            this.currentAnim = "walk-up";
          } else {
            this.player.play("walk-down", true);
            this.player.setFlipX(false);
            this.currentAnim = "walk-down";
          }
        }

        setIdleFromMove() {
          if (this.currentAnim === "walk-up") {
            this.player.play("idle-up", true);
          } else {
            this.player.play("idle-down", true);
          }
        }

        moveXiaobaiTo(sceneId, done) {
          const entrance = getEntranceTxTy(sceneId);
          const target = tileToWorld(entrance.tx, entrance.ty);
          const dx = target.x - this.playerShell.x;
          const dy = target.y - this.playerShell.y;

          if (Math.hypot(dx, dy) < 2) {
            if (done) done();
            return;
          }

          if (this.moveTween) this.moveTween.stop();
          this.playWalkAnim(dx, dy);
          this.applyMood(app.state.mood);

          const speed = moodToSpeed(app.state.mood);
          this.moveTween = this.tweens.add({
            targets: this.playerShell,
            x: target.x,
            y: target.y,
            duration: Math.max(700, Math.floor(2000 / speed)),
            ease: "Power2",
            onComplete: () => {
              this.setIdleFromMove();
              this.tweens.add({
                targets: this.playerShell,
                scaleX: { from: 0.92, to: 1.06 },
                scaleY: { from: 0.92, to: 1.06 },
                duration: 85,
                yoyo: true,
                repeat: 1,
                onComplete: () => {
                  this.playerShell.setScale(1);
                  if (done) done();
                }
              });
            }
          });
        }

        enterIndoor(roomId, done) {
          this.cameras.main.fadeOut(300, 0, 0, 0);
          this.cameras.main.once("camerafadeoutcomplete", () => {
            this.scene.setVisible(false);
            this.scene.launch("IndoorScene", { roomId });
            this.cameras.main.fadeIn(300, 0, 0, 0);
            if (done) done();
          });
        }

        getPlayerState() {
          return {
            x: Math.round(this.playerShell.x),
            y: Math.round(this.playerShell.y)
          };
        }
      }

      class IndoorScene extends Phaser.Scene {
        constructor() {
          super("IndoorScene");
          this.roomId = "home";
          this.player = null;
          this.playerShell = null;
          this.playerClaws = null;
          this.centerPulse = null;
          this.npc = null;
          this.npcOrbitTween = null;
          this.npcOrbit = { angle: 0, radius: 56 };
          this.stressTween = null;
          this.onResize = () => this.refreshIndoorCamera();
        }

        init(data) {
          this.roomId = data.roomId || "home";
        }

        create() {
          indoorRef = this;
          this.cameras.main.setBackgroundColor("#050913");

          this.buildRoom(this.roomId);
          this.buildPlayer();
          this.cameras.main.fadeIn(300, 0, 0, 0);

          this.applyMood(app.state.mood);
          this.updateThreat(app.state.threat);
          this.scale.on("resize", this.onResize, this);
          this.refreshIndoorCamera();

          const center = tileToWorld(10, 7);
          this.tweens.add({
            targets: this.playerShell,
            x: center.x,
            y: center.y,
            duration: 900,
            ease: "Sine.Out",
            onStart: () => this.playWalk("down"),
            onComplete: () => this.player.play("idle-down", true)
          });
        }

        shutdownScene() {
          if (this.npcOrbitTween) this.npcOrbitTween.stop();
          this.npcOrbitTween = null;
          this.npc = null;
          this.scale.off("resize", this.onResize, this);
          indoorRef = null;
        }

        refreshIndoorCamera() {
          const worldW = IN_W * TILE * SCALE;
          const worldH = IN_H * TILE * SCALE;
          const vw = this.scale.width;
          const vh = this.scale.height;
          const zoom = Math.max(vw / worldW, vh / worldH);
          this.cameras.main.setZoom(zoom);
          this.cameras.main.setBounds(0, 0, worldW, worldH);
          this.cameras.main.centerOn(worldW / 2, worldH / 2);
          this.cameras.main.setRoundPixels(true);
        }

        buildRoom(roomId) {
          const roomTint = {
            home: 0xfff3dc,
            cafe: 0xffe9d6,
            office: 0xdfeeff,
            market: 0xe2ffe8,
            social: 0xf2e1ff,
            bank: 0xf7f0d8,
            temple: 0xffe8b0,
            shelter: 0xd4ffe7
          };
          const bgTexture = roomId === "temple" || roomId === "bank" ? "dungeon-sample" : "town-sample";
          this.add.image(IN_W * TILE, IN_H * TILE, bgTexture)
            .setDisplaySize(IN_W * TILE * SCALE + 120, IN_H * TILE * SCALE + 110)
            .setAlpha(0.4)
            .setTint(roomTint[roomId] || 0xffffff)
            .setDepth(0);
          this.add.rectangle(IN_W * TILE, IN_H * TILE, IN_W * TILE * SCALE + 8, IN_H * TILE * SCALE + 8, 0x08101a, 0.34)
            .setStrokeStyle(2, 0xffffff, 0.08)
            .setDepth(1);

          const floor = buildGrid(IN_W, IN_H, 0);
          const walls = buildGrid(IN_W, IN_H, -1);
          const furniture = buildGrid(IN_W, IN_H, -1);

          for (let y = 0; y < IN_H; y += 1) {
            for (let x = 0; x < IN_W; x += 1) {
              floor[y][x] = [48, 49, 50, 51, 52, 53][(x * 3 + y * 5) % 6];
            }
          }

          for (let x = 0; x < IN_W; x += 1) {
            walls[0][x] = 4;
            walls[IN_H - 1][x] = 39;
          }
          for (let y = 0; y < IN_H; y += 1) {
            walls[y][0] = 14;
            walls[y][IN_W - 1] = 18;
          }

          const p = {
            home: () => {
              paintRect(floor, 1, 1, 18, 12, 49);
              paintRect(furniture, 2, 2, 2, 3, 63);
              paintRect(furniture, 3, 7, 3, 2, 72);
              paintRect(furniture, 13, 2, 3, 2, 57);
              paintRect(furniture, 14, 9, 3, 2, 75);
              furniture[8][10] = 127;
              this.add.text(190, 36, "🏠 小白的家", { fontFamily: "monospace", fontSize: "12px", color: "#ffe8c6" }).setOrigin(0.5).setDepth(15);

              const cat = this.add.text(188, 262, "🐈", { fontSize: "18px" }).setDepth(17);
              this.tweens.add({ targets: cat, scaleX: 1.08, scaleY: 1.08, yoyo: true, repeat: -1, duration: 900 });
            },
            cafe: () => {
              paintRect(floor, 1, 1, 18, 12, 50);
              paintRect(furniture, 2, 3, 5, 2, 72);
              paintRect(furniture, 7, 6, 3, 2, 73);
              paintRect(furniture, 12, 6, 3, 2, 73);
              paintRect(furniture, 15, 2, 2, 2, 55);
              this.add.text(190, 36, "☕ 咖啡厅", { fontFamily: "monospace", fontSize: "12px", color: "#f6d9be" }).setOrigin(0.5).setDepth(15);

              const wifi = this.add.circle(504, 126, 10, 0x67c8ff, 0.16).setDepth(18);
              this.tweens.add({ targets: wifi, scaleX: 1.8, scaleY: 1.8, alpha: 0, duration: 1200, repeat: -1 });
            },
            office: () => {
              paintRect(floor, 1, 1, 18, 12, 51);
              paintRect(furniture, 2, 3, 3, 2, 63);
              paintRect(furniture, 6, 3, 3, 2, 63);
              paintRect(furniture, 10, 3, 3, 2, 63);
              paintRect(furniture, 14, 3, 3, 2, 63);
              paintRect(furniture, 14, 8, 3, 2, 67);
              paintRect(furniture, 4, 9, 2, 2, 101);
              this.add.text(190, 36, "🏢 职场", { fontFamily: "monospace", fontSize: "12px", color: "#d4e9ff" }).setOrigin(0.5).setDepth(15);
              this.add.text(472, 62, "⚠️ 安全提醒", { fontFamily: "monospace", fontSize: "11px", color: "#ffde96" }).setDepth(18);
            },
            temple: () => {
              paintRect(floor, 1, 1, 18, 12, 52);
              paintRect(furniture, 4, 2, 1, 9, 57);
              paintRect(furniture, 15, 2, 1, 9, 57);
              paintRect(furniture, 9, 5, 2, 2, 94);
              paintRect(furniture, 9, 2, 2, 2, 95);
              this.add.text(190, 36, "🏛 神庙区", { fontFamily: "monospace", fontSize: "12px", color: "#ffeab0" }).setOrigin(0.5).setDepth(15);

              const altar = this.add.circle(320, 224, 28, 0xf8c84a, 0.16).setDepth(16);
              this.centerPulse = this.tweens.add({ targets: altar, scaleX: 1.5, scaleY: 1.5, alpha: 0.05, duration: 1000, yoyo: true, repeat: -1 });

              const gold = this.add.particles(320, 224, "tileset-indoor-sprites", {
                frame: 105,
                lifespan: 900,
                speed: { min: 12, max: 36 },
                quantity: 1,
                frequency: 80,
                scale: { start: 1.1, end: 0 },
                alpha: { start: 0.9, end: 0 },
                blendMode: "ADD"
              });
              gold.setDepth(20);
            },
            bank: () => {
              paintRect(floor, 1, 1, 18, 12, 53);
              paintRect(furniture, 2, 3, 14, 2, 72);
              paintRect(furniture, 4, 8, 2, 2, 63);
              paintRect(furniture, 7, 8, 2, 2, 63);
              paintRect(furniture, 10, 8, 2, 2, 63);
              paintRect(furniture, 15, 8, 2, 3, 57);
              this.add.text(190, 36, "🏦 网络银行", { fontFamily: "monospace", fontSize: "12px", color: "#f6f2dc" }).setOrigin(0.5).setDepth(15);
            },
            shelter: () => {
              paintRect(floor, 1, 1, 18, 12, 48);
              paintRect(furniture, 8, 5, 4, 4, 95);
              paintRect(furniture, 3, 3, 3, 2, 54);
              paintRect(furniture, 14, 3, 3, 2, 54);
              paintRect(furniture, 14, 9, 2, 2, 127);
              this.add.text(190, 36, "🛡 安全屋", { fontFamily: "monospace", fontSize: "12px", color: "#d8ffe7" }).setOrigin(0.5).setDepth(15);

              const calm = this.add.circle(320, 224, 42, 0x3effaa, 0.08).setDepth(16);
              this.tweens.add({ targets: calm, scaleX: 1.5, scaleY: 1.5, alpha: 0.02, duration: 1100, yoyo: true, repeat: -1 });
            },
            market: () => {
              paintRect(floor, 1, 1, 18, 12, 50);
              paintRect(furniture, 4, 5, 12, 3, 67);
              this.add.text(190, 36, "🛒 网购广场", { fontFamily: "monospace", fontSize: "12px", color: "#d2ffe8" }).setOrigin(0.5).setDepth(15);
            },
            social: () => {
              paintRect(floor, 1, 1, 18, 12, 51);
              paintRect(furniture, 5, 4, 10, 3, 75);
              this.add.text(190, 36, "📱 社交广场", { fontFamily: "monospace", fontSize: "12px", color: "#ecd7ff" }).setOrigin(0.5).setDepth(15);
            }
          };

          (p[roomId] || p.home)();

          const map = this.make.tilemap({ width: IN_W, height: IN_H, tileWidth: TILE, tileHeight: TILE });
          const tileset = map.addTilesetImage("tileset-indoor", null, TILE, TILE, 0, 0);

          const floorLayer = map.createBlankLayer("floor", tileset, 0, 0);
          const wallLayer = map.createBlankLayer("wall", tileset, 0, 0);
          const furnLayer = map.createBlankLayer("furn", tileset, 0, 0);

          const applyData = (layer, data) => {
            for (let y = 0; y < data.length; y += 1) {
              for (let x = 0; x < data[y].length; x += 1) {
                if (data[y][x] >= 0) layer.putTileAt(data[y][x], x, y);
              }
            }
          };

          applyData(floorLayer, floor);
          applyData(wallLayer, walls);
          applyData(furnLayer, furniture);

          [floorLayer, wallLayer, furnLayer].forEach((layer, idx) => {
            layer.setScale(SCALE);
            layer.setDepth(2 + idx);
          });
          this.add.rectangle(IN_W * TILE, IN_H * TILE, IN_W * TILE * SCALE, IN_H * TILE * SCALE, 0x000000, 0.12).setDepth(8);

          this.cameras.main.setBounds(0, 0, IN_W * TILE * SCALE, IN_H * TILE * SCALE);
        }

        buildPlayer() {
          const spawn = tileToWorld(10, 12.3);
          this.player = this.add.sprite(0, 0, "xiaobai", 110).setScale(2).setDepth(30);
          this.player.setOrigin(0.5, 0.75);
          this.player.play("idle-down");

          this.playerClaws = this.add.graphics();
          this.playerClaws.fillStyle(0xff5f40, 0.95);
          this.playerClaws.fillRect(-12, -10, 5, 3);
          this.playerClaws.fillRect(7, -10, 5, 3);

          this.playerShell = this.add.container(spawn.x, spawn.y, [this.player, this.playerClaws]).setDepth(30);
        }

        playWalk(direction) {
          if (direction === "up") {
            this.player.play("walk-up", true);
            this.player.setFlipX(false);
          } else if (direction === "left") {
            this.player.play("walk-side", true);
            this.player.setFlipX(true);
          } else if (direction === "right") {
            this.player.play("walk-side", true);
            this.player.setFlipX(false);
          } else {
            this.player.play("walk-down", true);
            this.player.setFlipX(false);
          }
        }

        applyMood(mood) {
          this.player.anims.timeScale = moodToSpeed(mood);

          if (this.stressTween) {
            this.stressTween.stop();
            this.stressTween = null;
          }

          if (mood === "危险" || mood === "恐慌") {
            this.stressTween = this.tweens.add({
              targets: this.playerShell,
              x: this.playerShell.x + 2,
              yoyo: true,
              duration: 55,
              repeat: -1
            });
          }
        }

        updateThreat(threatText) {
          if (this.npcOrbitTween) {
            this.npcOrbitTween.stop();
            this.npcOrbitTween = null;
          }
          if (this.npc) {
            this.npc.destroy();
            this.npc = null;
          }

          if (!threatText || this.roomId === "shelter") return;

          const origin = tileToWorld(10, 6.5);
          const npc = this.add.container(origin.x + this.npcOrbit.radius, origin.y).setDepth(35);

          const body = this.add.circle(0, 0, 16, 0x6a2cd8, 0.9);
          const aura = this.add.circle(0, 0, 22, 0x6a2cd8, 0.22);
          const icon = this.add.text(0, -1, this.roomId === "office" ? "✉" : this.roomId === "bank" ? "☠" : "?", {
            fontFamily: "monospace",
            fontSize: "16px",
            color: "#ffffff"
          }).setOrigin(0.5);

          npc.add([aura, body, icon]);
          this.npc = npc;
          this.npcOrbit = { angle: 0, radius: 56, ox: origin.x, oy: origin.y };

          this.npcOrbitTween = this.tweens.add({
            targets: this.npcOrbit,
            angle: 360,
            duration: 3600,
            repeat: -1,
            ease: "Linear",
            onUpdate: () => {
              const rad = Phaser.Math.DegToRad(this.npcOrbit.angle);
              npc.setPosition(
                this.npcOrbit.ox + Math.cos(rad) * this.npcOrbit.radius,
                this.npcOrbit.oy + Math.sin(rad) * this.npcOrbit.radius * 0.6
              );
            }
          });
        }

        exitToOverworld(done) {
          this.cameras.main.fadeOut(300, 0, 0, 0);
          this.cameras.main.once("camerafadeoutcomplete", () => {
            this.scene.setVisible(true, "OverworldScene");
            this.shutdownScene();
            this.scene.stop();
            if (done) done();
          });
        }

        getPlayerState() {
          return {
            x: Math.round(this.playerShell.x),
            y: Math.round(this.playerShell.y)
          };
        }
      }

      class UIScene extends Phaser.Scene {
        constructor() {
          super("UIScene");
        }

        create() {
          bus.on("ui:update", updateUI);
          this.events.on("shutdown", () => {
            bus.off("ui:update", updateUI);
          });
          updateUI();
        }
      }

      function applyMoodToActiveScenes(mood) {
        if (overworldRef) overworldRef.applyMood(mood);
        if (indoorRef) indoorRef.applyMood(mood);
      }

      function applyThreatToIndoor(threatText) {
        if (indoorRef) indoorRef.updateThreat(threatText);
      }

      function requestNavigation(sceneId) {
        app.pendingSceneId = sceneId;
        processNavigation();
      }

      function processNavigation() {
        if (app.navigationBusy) return;
        if (!app.pendingSceneId) return;
        if (!overworldRef) return;

        const target = app.pendingSceneId;
        app.pendingSceneId = null;

        const wantsIndoor = INDOOR_ROOMS.has(target);

        const finish = () => {
          app.currentSceneId = target;
          app.layer = wantsIndoor ? "indoor" : "overworld";
          app.navigationBusy = false;
          bus.emit("ui:update");
          processNavigation();
        };

        const moveOnOverworld = () => {
          overworldRef.scene.setVisible(true);
          app.layer = "overworld";
          bus.emit("ui:update");
          overworldRef.moveXiaobaiTo(target, () => {
            if (wantsIndoor) {
              overworldRef.enterIndoor(target, () => {
                finish();
                applyThreatToIndoor(app.state.threat);
                applyMoodToActiveScenes(app.state.mood);
              });
            } else {
              finish();
            }
          });
        };

        app.navigationBusy = true;

        if (app.layer === "indoor" && indoorRef) {
          indoorRef.exitToOverworld(moveOnOverworld);
        } else {
          moveOnOverworld();
        }
      }

      function applyState(input, options = {}) {
        const prev = app.state;
        const next = normalizeState(input);
        app.state = next;

        const prevScene = resolveSceneId(prev.location);
        const nextScene = resolveSceneId(next.location);
        const locationChanged = prevScene !== nextScene;

        if (options.forceEvent || (options.eventText && options.eventText !== prev.last_event)) {
          addEvent(options.eventText || next.last_event);
        }

        applyMoodToActiveScenes(next.mood);
        applyThreatToIndoor(next.threat);

        if (locationChanged || options.forceNavigate) {
          requestNavigation(nextScene);
        }

        bus.emit("ui:update");
      }

      async function fetchWorldState() {
        try {
          const res = await fetch(`world-state.json?t=${Date.now()}`, { cache: "no-store" });
          if (!res.ok) throw new Error(String(res.status));
          return await res.json();
        } catch {
          return null;
        }
      }

      async function pollWorldState() {
        const data = await fetchWorldState();
        if (!data) {
          app.liveMisses += 1;
          if (app.mode === "LIVE" && app.liveMisses >= 3) {
            setMode("DEMO");
            addEvent("→ world-state.json 不可用，切换回 DEMO");
            bus.emit("ui:update");
          }
          return;
        }

        app.liveMisses = 0;
        if (app.mode !== "LIVE") {
          setMode("LIVE");
          addEvent("✓ 已接入 world-state.json，进入 LIVE");
        }

        const signature = [
          data.last_updated || "",
          data.location || "",
          data.mood || "",
          data.threat || "",
          data.last_event || "",
          data.resolved_threats || ""
        ].join("|");

        const changed = signature !== app.liveSignature;
        app.liveSignature = signature;

        applyState(
          {
            xiaobai_name: data.xiaobai_name || app.state.xiaobai_name,
            level: Number.isFinite(Number(data.level)) ? Number(data.level) : app.state.level,
            location: data.location || app.state.location,
            mood: data.mood || app.state.mood,
            threat: Object.prototype.hasOwnProperty.call(data, "threat") ? data.threat : app.state.threat,
            resolved_threats: Number.isFinite(Number(data.resolved_threats)) ? Number(data.resolved_threats) : app.state.resolved_threats,
            last_event: data.last_event || app.state.last_event,
            last_updated: data.last_updated || new Date().toISOString()
          },
          {
            eventText: changed ? data.last_event || app.state.last_event : null
          }
        );
      }

      function startDemoLoop() {
        if (app.demoTimer) return;
        app.demoStart = Date.now();
        app.demoIndex = -1;
        app.demoResolved = DEFAULT_STATE.resolved_threats;
        app.demoLevel = DEFAULT_STATE.level;

        app.demoTimer = window.setInterval(() => {
          if (app.mode !== "DEMO") return;

          const elapsed = ((Date.now() - app.demoStart) / 1000) % 80;
          let idx = 0;
          for (let i = 0; i < DEMO_SCRIPT.length; i += 1) {
            if (elapsed >= DEMO_SCRIPT[i].t) idx = i;
          }

          if (idx < app.demoIndex) {
            app.demoIndex = -1;
            app.demoResolved = DEFAULT_STATE.resolved_threats;
            app.demoLevel = DEFAULT_STATE.level;
          }
          if (idx === app.demoIndex) return;

          app.demoIndex = idx;
          const step = DEMO_SCRIPT[idx];
          if (step.event.startsWith("✓")) app.demoResolved += 1;

          applyState(
            {
              xiaobai_name: "小白",
              level: app.demoLevel,
              location: step.location,
              mood: step.mood,
              threat: step.threat,
              resolved_threats: app.demoResolved,
              last_event: step.event,
              last_updated: new Date().toISOString()
            },
            {
              eventText: step.event,
              forceEvent: true,
              forceNavigate: true
            }
          );
        }, 280);
      }

      function initStateAndUI() {
        setMode("DEMO");
        applyState(DEFAULT_STATE, {
          eventText: DEFAULT_STATE.last_event,
          forceEvent: true,
          forceNavigate: true
        });
        bus.emit("ui:update");
      }

      function exposeTextHooks() {
        window.render_game_to_text = () => {
          const sceneId = resolveSceneId(app.state.location);
          const activePlayer = app.layer === "indoor" && indoorRef ? indoorRef.getPlayerState() : overworldRef ? overworldRef.getPlayerState() : { x: 0, y: 0 };
          return JSON.stringify({
            coordinate_system: "origin top-left, +x right, +y down, pixels after SCALE=2",
            mode: app.mode,
            layer: app.layer,
            scene_id: sceneId,
            location: app.state.location,
            mood: app.state.mood,
            threat: app.state.threat,
            resolved_threats: app.state.resolved_threats,
            player: activePlayer
          });
        };

        window.advanceTime = (ms) => {
          if (!gameRef || typeof gameRef.step !== "function") return;
          const steps = Math.max(1, Math.round(ms / (1000 / 60)));
          for (let i = 0; i < steps; i += 1) {
            gameRef.step(0, 1000 / 60);
          }
        };
      }

      gameRef = new Phaser.Game({
        type: Phaser.AUTO,
        parent: "game-container",
        width: 1280,
        height: 896,
        backgroundColor: "#050d1a",
        pixelArt: true,
        antialias: false,
        scene: [BootScene, OverworldScene, IndoorScene, UIScene],
        scale: {
          mode: Phaser.Scale.RESIZE,
          autoCenter: Phaser.Scale.CENTER_BOTH
        },
        render: {
          roundPixels: true
        }
      });

      exposeTextHooks();
      initStateAndUI();
      startDemoLoop();

      pollWorldState();
      window.setInterval(pollWorldState, 2000);

      window.addEventListener("beforeunload", () => {
        if (app.demoTimer) window.clearInterval(app.demoTimer);
        if (gameRef) gameRef.destroy(true);
      });
    })();
  </script>
</body>
